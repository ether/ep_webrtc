# Publicly credit Sauce Labs because they generously support open source
# projects.
name: Frontend Tests

on:
  workflow_call:

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    name: Playwright (Node ${{ matrix.node }} / core ${{ matrix.core_ref || 'develop' }})
    strategy:
      fail-fast: false
      # Plugin floor stays engines.node >=22, but current Etherpad core
      # requires >=24 (engineStrict) and this plugin's tests use features
      # that the last Node 22 core (v2.7.3) lacks, so test Node 24 / 26
      # against current develop only.
      matrix:
        include:
          - node: '24'
            core_ref: ''
          - node: '26'
            core_ref: ''

    steps:
      -
        name: Check out Etherpad core
        uses: actions/checkout@v7
        with:
          repository: ether/etherpad-lite
          ref: ${{ matrix.core_ref }}
          path: etherpad-lite
      - uses: actions/setup-node@v7
        name: Install Node.js
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v6.1.1
        name: Install pnpm
        with:
          package_json_file: ./etherpad-lite/package.json
          run_install: false
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      -
        name: Checkout plugin repository
        uses: actions/checkout@v7
        with:
          path: plugin
      -
        name: Install Etherpad core dependencies
        working-directory: ./etherpad-lite
        run: bin/installDeps.sh
      - name: Install plugin
        working-directory: ./etherpad-lite
        run: |
          pnpm run plugins i --path ../../plugin
      - name: Create settings.json
        working-directory: ./etherpad-lite
        run: cp ./src/tests/settings.json settings.json
      - name: Run the frontend tests
        working-directory: ./etherpad-lite
        shell: bash
        run: |
          pnpm run dev &
          connected=false
          can_connect() {
            curl -sSfo /dev/null http://localhost:9001/ || return 1
            connected=true
          }
          now() { date +%s; }
          start=$(now)
          while [ $(($(now) - $start)) -le 30 ] && ! can_connect; do
            sleep 1
          done
          cd src
          pnpm exec playwright install chromium --with-deps
          pnpm run test-ui --project=chromium
